<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Kredit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen p-3 sm:p-6">
<div class="max-w-md mx-auto space-y-4">

    <div class="bg-white rounded-2xl p-5 shadow-xl">
        <h1 class="text-lg font-bold mb-1">🔐 Admin Kredit</h1>
        <p class="text-xs text-slate-500 mb-3">Halaman ini hanya untuk anda. Jangan kongsi kunci admin.</p>
        <label class="block text-xs font-semibold uppercase tracking-wider mb-1">Kunci Admin</label>
        <input type="password" id="adminKey" autocomplete="off" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tampal kunci admin">
    </div>

    <div class="bg-white rounded-2xl p-5 shadow-xl">
        <h2 class="font-bold mb-3">1. Buat kod baharu (selepas pelanggan bayar)</h2>
        <label class="block text-xs font-semibold uppercase tracking-wider mb-1">Pakej</label>
        <select id="pkg" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm mb-3 bg-white">
            <option value="30">Asas - 30 skrip (RM5)</option>
            <option value="100">Popular - 100 skrip (RM10)</option>
            <option value="300">Peniaga - 300 skrip (RM25)</option>
            <option value="custom">Lain-lain (taip bilangan)</option>
        </select>
        <input type="number" id="customCredits" min="1" class="hidden w-full p-2.5 border border-slate-300 rounded-xl text-sm mb-3" placeholder="Bilangan kredit">
        <label class="block text-xs font-semibold uppercase tracking-wider mb-1">Nota pelanggan (pilihan)</label>
        <input type="text" id="note" maxlength="80" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm mb-3" placeholder="Cth: Kak Nurul, 0123456789">
        <button onclick="createCode()" id="createBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm">Jana Kod</button>

        <div id="createResult" class="hidden mt-4">
            <div class="text-xs text-slate-500 mb-1">Kod:</div>
            <div id="newCode" class="text-xl font-bold tracking-wider text-blue-700 mb-3 select-all"></div>
            <div class="text-xs text-slate-500 mb-1">Mesej untuk dihantar kepada pelanggan:</div>
            <textarea id="waMsg" rows="9" class="w-full p-2.5 border border-slate-300 rounded-xl text-xs bg-slate-50"></textarea>
            <div class="flex gap-2 mt-2">
                <button onclick="copyMsg()" class="flex-1 bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-sm">Salin Mesej</button>
                <button onclick="openWA()" class="flex-1 bg-emerald-600 text-white font-semibold py-2.5 rounded-xl text-sm">Buka WhatsApp</button>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-2xl p-5 shadow-xl">
        <h2 class="font-bold mb-3">2. Semak baki / tambah kredit pelanggan lama</h2>
        <input type="text" id="chkCode" class="w-full p-2.5 border border-slate-300 rounded-xl text-sm mb-2 uppercase" placeholder="SKRIP-XXXX-XXXX">
        <div class="flex gap-2 mb-2">
            <button onclick="checkCode()" class="flex-1 bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-sm">Semak Baki</button>
        </div>
        <div class="flex gap-2">
            <input type="number" id="addCredits" min="1" class="flex-1 min-w-0 p-2.5 border border-slate-300 rounded-xl text-sm" placeholder="Tambah berapa kredit?">
            <button onclick="addCredits()" class="bg-emerald-600 text-white font-semibold px-4 rounded-xl text-sm shrink-0">Tambah</button>
        </div>
        <p id="chkResult" class="text-sm mt-3 text-slate-700"></p>
    </div>

    <p id="status" class="text-center text-sm text-amber-300 min-h-[1.25rem]"></p>
</div>

<script>
    const API_BASE = "https://skrip-proxy.twinsalwa81.workers.dev";
    const APP_URL = "https://salwa-ibrahim81.github.io/App-pertama/";

    const $ = (id) => document.getElementById(id);

    $('pkg').addEventListener('change', function () {
        $('customCredits').classList.toggle('hidden', this.value !== 'custom');
    });

    function setStatus(t) { $('status').innerText = t; }

    async function admin(path, payload) {
        const key = $('adminKey').value.trim();
        if (!key) { setStatus('Sila isi Kunci Admin dahulu.'); throw new Error('nokey'); }
        const res = await fetch(API_BASE + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-key': key },
            body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) { setStatus('Kunci admin salah.'); throw new Error('401'); }
        if (res.status === 429) { setStatus('Terlalu banyak cubaan salah. Cuba sejam lagi.'); throw new Error('429'); }
        return data;
    }

    async function createCode() {
        setStatus('');
        let credits = $('pkg').value === 'custom' ? parseInt($('customCredits').value, 10) : parseInt($('pkg').value, 10);
        if (!(credits >= 1)) { setStatus('Sila masukkan bilangan kredit.'); return; }
        $('createBtn').disabled = true;
        try {
            const d = await admin('/admin/create', { credits: credits, count: 1, note: $('note').value.trim() });
            if (d.codes && d.codes[0]) {
                const c = d.codes[0];
                $('newCode').innerText = c.code;
                $('waMsg').value =
`Terima kasih, pembayaran diterima! 🎉

Kod kredit anda: *${c.code}*
Baki: ${c.credits} skrip

Cara guna:
1. Buka ${APP_URL}
2. Tekan butang + di penjuru atas kanan
3. Masukkan kod di ruangan "Dah bayar?", tekan Guna Kod

Simpan kod ini baik-baik. Boleh digunakan di mana-mana telefon. Selamat berjaya! 💪`;
                $('createResult').classList.remove('hidden');
                setStatus('Kod berjaya dijana.');
            } else {
                setStatus('Gagal: ' + (d.error || 'tidak diketahui'));
            }
        } catch (e) {
            if (!['nokey', '401', '429'].includes(e.message)) setStatus('Masalah sambungan.');
        }
        $('createBtn').disabled = false;
    }

    function copyMsg() {
        const ta = $('waMsg');
        ta.select();
        document.execCommand('copy');
        setStatus('Mesej disalin.');
    }

    function openWA() {
        window.open('https://wa.me/?text=' + encodeURIComponent($('waMsg').value), '_blank');
    }

    async function checkCode() {
        setStatus('');
        const code = $('chkCode').value.trim().toUpperCase();
        if (!code) { setStatus('Masukkan kod.'); return; }
        try {
            const d = await admin('/admin/check', { code: code });
            $('chkResult').innerText = d.error ? 'Kod tidak dijumpai.' :
                `Baki: ${d.credits} kredit (jumlah dibeli: ${d.initial})${d.note ? ' | ' + d.note : ''}`;
        } catch (e) {
            if (!['nokey', '401', '429'].includes(e.message)) setStatus('Masalah sambungan.');
        }
    }

    async function addCredits() {
        setStatus('');
        const code = $('chkCode').value.trim().toUpperCase();
        const n = parseInt($('addCredits').value, 10);
        if (!code || !(n >= 1)) { setStatus('Masukkan kod dan bilangan kredit.'); return; }
        try {
            const d = await admin('/admin/add', { code: code, credits: n });
            $('chkResult').innerText = d.error ? 'Kod tidak dijumpai.' : `Berjaya. Baki baharu: ${d.credits} kredit.`;
        } catch (e) {
            if (!['nokey', '401', '429'].includes(e.message)) setStatus('Masalah sambungan.');
        }
    }
</script>
</body>
</html>
