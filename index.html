<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Skrip Generator Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-3 sm:p-6 relative overflow-x-hidden">

    <!-- Background Decorative Elements -->
    <div class="fixed -top-40 -left-40 w-80 sm:w-96 h-80 sm:h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed -bottom-40 -right-40 w-80 sm:w-96 h-80 sm:h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Container Card -->
    <div class="glass-card w-full max-w-xl rounded-2xl shadow-2xl border border-white/20 p-5 sm:p-8 relative z-10 my-auto">
        
        <!-- Header -->
        <div class="flex flex-row justify-between items-center gap-2 mb-6 pb-4 border-b border-slate-200">
            <div class="flex items-center gap-2.5">
                <div class="bg-gradient-to-tr from-blue-600 to-purple-600 text-white p-2 rounded-xl text-lg flex items-center justify-center w-10 h-10 shadow-md">
                    ✨
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                        AI Skrip Generator
                    </h1>
                    <p class="text-[11px] sm:text-xs text-slate-500">Jana skrip jualan TikTok & Reels automatik.</p>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5 bg-slate-100/80 p-1.5 rounded-xl border border-slate-200 shrink-0">
                <span class="bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded-lg shadow-sm flex items-center gap-1">
                    🪙
                    <span id="creditCount">5</span>/5
                </span>
                <button onclick="openTopupModal()" class="text-xs bg-emerald-500 hover:bg-emerald-600 text-white font-medium px-2 py-1 rounded-lg transition shadow-sm" title="Top Up Kredit">
                    +
                </button>
            </div>
        </div>

        <!-- Form Inputs -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                    Nama Produk <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        📦
                    </span>
                    <input type="text" id="productName" placeholder="Contoh: Sambal Nyet Khairulaming" class="w-full pl-9 pr-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm bg-white">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                    Kelebihan / USP Produk <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        ⭐
                    </span>
