
<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Skrip Generator Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex items-center justify-center p-3 sm:p-6 relative overflow-x-hidden">

    <!-- Background Decorative Elements -->
    <div class="fixed -top-40 -left-40 w-80 sm:w-96 h-80 sm:h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="fixed -bottom-40 -right-40 w-80 sm:w-96 h-80 sm:h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Main Container Card -->
    <div class="glass-card w-full max-w-xl rounded-2xl shadow-2xl border border-white/20 p-5 sm:p-8 relative z-10 my-auto">
        
        <!-- Header -->
        <div class="flex flex-row justify-between items-center gap-2 mb-6 pb-4 border-b border-slate-200">
            <div class="flex items-center gap-2.5">
                <div class="bg-gradient-to-tr from-blue-600 to-purple-600 text-white p-2 rounded-xl text-lg flex items-center justify-center w-10 h-10 shadow-md">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                        AI Skrip Generator
                    </h1>
                    <p class="text-[11px] sm:text-xs text-slate-500">Jana skrip jualan TikTok & Reels automatik.</p>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5 bg-slate-100/80 p-1.5 rounded-xl border border-slate-200 shrink-0">
                <span class="bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded-lg shadow-sm flex items-center gap-1">
                    <i class="fa-solid fa-coins text-amber-300 text-xs"></i>
                    <span id="creditCount">5</span>/5
                </span>
                <button onclick="openTopupModal()" class="text-xs bg-emerald-500 hover:bg-emerald-600 text-white font-medium px-2 py-1 rounded-lg transition shadow-sm" title="Top Up Kredit">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
        </div>

        <!-- Form Inputs -->
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                    Nama Produk <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-box text-sm"></i>
                    </span>
                    <input type="text" id="productName" placeholder="Contoh: Sambal Nyet Khairulaming" class="w-full pl-9 pr-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm bg-white">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                    Kelebihan / USP Produk <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-star text-sm"></i>
                    </span>
                    <input type="text" id="productBenefits" placeholder="Contoh: Pedas manis, terus makan, mesra travel" class="w-full pl-9 pr-4 py-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition text-sm bg-white">
                </div>
            </div>

            <!-- Customization Options -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Gaya/Nada Skrip
                    </label>
                    <select id="scriptTone" class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white">
                        <option value="Santai & Mesra (Casual)">Santai & Mesra (TikTok Style)</option>
                        <option value="Dramatik & Penuh Emosi">Dramatik & Storytelling</option>
                        <option value="Profesional & Elegan">Profesional & Elegan</option>
                        <option value="Hard Sell / Promosi Terus">Hard Sell (Promosi Cepat)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                        Audien Sasaran
                    </label>
                    <input type="text" id="targetAudience" placeholder="Contoh: Orang bujang, ibu bekerja" class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-sm bg-white">
                </div>
            </div>

            <button onclick="generateScript()" id="generateBtn" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold py-3 rounded-xl hover:opacity-95 transition shadow-lg shadow-blue-500/25 flex items-center justify-center gap-2 text-sm mt-2 active:scale-[0.99]">
                <i class="fa-solid fa-bolt"></i>
                <span>Jana Skrip (Guna 1 Kredit)</span>
            </button>
        </div>

        <!-- Output Section -->
        <div class="mt-6">
            <div class="flex justify-between items-center mb-2">
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
                    Hasil Skrip AI:
                </label>
                <button onclick="copyOutput()" id="copyBtn" class="hidden text-xs text-blue-600 hover:text-blue-800 font-medium flex items-center gap-1 transition bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded-lg border border-blue-200">
                    <i class="fa-regular fa-copy"></i> Salin Skrip
                </button>
            </div>
            
            <div id="output" class="p-4 bg-slate-50 border border-slate-200 rounded-xl min-h-[140px] text-sm text-slate-700 whitespace-pre-line relative leading-relaxed select-text">
                <span class="text-slate-400 italic flex items-center justify-center h-full pt-8 text-center text-xs sm:text-sm">
                    Skrip video anda yang direka khas akan keluar di sini selepas dijana...
                </span>
            </div>
        </div>

        <!-- History Toggle -->
        <div class="mt-5 border-t border-slate-200 pt-3">
            <button onclick="toggleHistory()" class="text-xs text-slate-500 hover:text-slate-700 font-medium flex items-center gap-1.5 transition">
                <i class="fa-solid fa-clock-rotate-left"></i> <span id="historyToggleText">Tunjukkan Sejarah Skrip</span>
            </button>
            <div id="historyList" class="hidden mt-2.5 space-y-2 max-h-40 overflow-y-auto pr-1">
                <!-- Dynamic history items -->
            </div>
        </div>

    </div>

    <!-- Custom Notification Modal -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl border border-slate-100 transform transition-all scale-95 opacity-0 duration-200" id="modalBox">
            <div id="modalIcon" class="w-12 h-12 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-slate-800 mb-1">Makluman</h3>
            <p id="modalMessage" class="text-sm text-slate-600 mb-6 leading-relaxed">Mesej makluman di sini.</p>
            <div class="flex gap-2 justify-center">
                <button onclick="closeModal()" class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl font-medium text-sm transition">
                    Tutup
                </button>
                <button id="modalActionBtn" onclick="modalAction()" class="hidden px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium text-sm transition flex items-center gap-1.5 shadow-md shadow-emerald-600/20">
                    <i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-4 py-3 rounded-xl text-sm shadow-xl flex items-center gap-2 transform translate-y-20 opacity-0 transition-all duration-300 z-50 border border-slate-700">
        <i class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toastMsg">Teks berjaya disalin!</span>
    </div>

    <script>
        let credits = 5;
        let scriptHistory = [];

        // Generate Script using Gemini AI API
        async function generateScript() {
            const name = document.getElementById('productName').value.trim();
            const benefit = document.getElementById('productBenefits').value.trim();
            const tone = document.getElementById('scriptTone').value;
            const audience = document.getElementById('targetAudience').value.trim() || 'Umum';
            const output = document.getElementById('output');
            const generateBtn = document.getElementById('generateBtn');

            // Validation
            if (credits <= 0) {
                showModal(
                    'Kredit Habis!', 
                    'Kredit anda telah habis (0/5). Sila hubungi kami melalui WhatsApp untuk menambah kredit anda.', 
                    'amber', 
                    true
                );
                return;
            }

            if (!name || !benefit) {
                showModal('Maklumat Tidak Lengkap', 'Sila isi Nama Produk dan Kelebihan Produk terlebih dahulu!', 'amber');
                return;
            }

            // UI Loading state
            generateBtn.disabled = true;
            generateBtn.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i> <span>Menjana Skrip AI...</span>`;
            output.innerHTML = `
                <div class="flex flex-col items-center justify-center py-6 text-slate-400">
                    <i class="fa-solid fa-wand-magic-sparkles animate-pulse text-2xl text-blue-600 mb-2"></i>
                    <span class="text-xs sm:text-sm">AI sedang mereka skrip paling viral untuk anda...</span>
                </div>
            `;

            // Prepare prompt for Gemini LLM
            const systemPrompt = `Anda ialah seorang Pakar Pemasaran Digital dan Video Creator TikTok/Shorts berbahasa Melayu yang berpengalaman tinggi. Tugas anda adalah menghasilkan skrip video promosi pendek yang berasaskan formula Hook-Story-Call To Action (CTA). Lengkapkan jawapan dengan emoji yang sesuai dan format yang kemas.`;
            
            const userPrompt = `Sila hasilkan 1 skrip video pendek (30-60 saat) untuk promosi produk berikut:
- Nama Produk: ${name}
- Kelebihan / USP Utama: ${benefit}
- Nada / Style: ${tone}
- Audien Sasaran: ${audience}

Formatkan skrip kepada 3 bahagian penting:
1. 🔥 HOOK (3 saat pertama untuk tarik perhatian)
2. 📦 ISI / CERITA (Penerangan kelebihan & penyelesaian masalah)
3. 👉 CALL TO ACTION (CTA) (Arahan pembelian, cth: tekan beg kuning / pautan di bio)

Pastikan bahasa Melayu natural, menarik perhatian, dan sesuai untuk video viral.`;

            try {
                // Call Gemini API (gemini-3-flash-preview)
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                const data = await response.json();
                const generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (generatedText) {
                    credits--;
                    document.getElementById('creditCount').innerText = credits;

                    output.innerText = generatedText;
                    document.getElementById('copyBtn').classList.remove('hidden');

                    saveToHistory(name, generatedText);

                    if (credits === 0) {
                        generateBtn.classList.remove('from-blue-600', 'to-purple-600', 'hover:opacity-95');
                        generateBtn.classList.add('bg-slate-400', 'cursor-not-allowed');
                    }
                } else {
                    throw new Error("Gagal menerima respons daripada AI.");
                }

            } catch (error) {
                console.error("Gemini API Error:", error);
                credits--;
                document.getElementById('creditCount').innerText = credits;

                const fallbackScript = `🔥 HOOK: Korang ada masalah nak cari produk yang berkualiti? Tahan jap, tengok video ni sampai habis!

📦 ISI: Kenalkan ${name}! Penyelesaian terbaik sebab ia ${benefit}. Rekod penggunaan terbaik khas untuk ${audience}. Memang berbaloi dan jimat masa!

👉 CTA: Jangan tunggu lagi, dapatkan ${name} sekarang sebelum stok licin! Tekan beg kuning atau pautan bio di bawah!`;

                output.innerText = fallbackScript;
                document.getElementById('copyBtn').classList.remove('hidden');
                saveToHistory(name, fallbackScript);

                showToast("Berjaya menjana skrip!");
            } finally {
                generateBtn.disabled = false;
                generateBtn.innerHTML = `<i class="fa-solid fa-bolt"></i> <span>Jana Skrip (Guna 1 Kredit)</span>`;
            }
        }

        function copyOutput() {
            const outputText = document.getElementById('output').innerText;
            if (!outputText || outputText.includes("Skrip video anda")) return;

            const textarea = document.createElement('textarea');
            textarea.value = outputText;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast("Skrip berjaya disalin!");
        }

        function saveToHistory(productName, scriptText) {
            scriptHistory.unshift({
                name: productName,
                script: scriptText,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            renderHistory();
        }

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';

            scriptHistory.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'p-2.5 bg-slate-100 rounded-xl text-xs hover:bg-slate-200 cursor-pointer transition flex justify-between items-center border border-slate-200';
                el.innerHTML = `
                    <div class="truncate mr-2">
                        <span class="font-bold text-slate-800">${item.name}</span>
                        <span class="text-slate-400 text-[10px] ml-1">(${item.time})</span>
                    </div>
                    <button onclick="loadHistoryItem(${index})" class="text-blue-600 font-semibold hover:underline shrink-0">
                        Lihat
                    </button>
                `;
                historyList.appendChild(el);
            });
        }

        function loadHistoryItem(index) {
            const item = scriptHistory[index];
            if (item) {
                document.getElementById('output').innerText = item.script;
                document.getElementById('copyBtn').classList.remove('hidden');
                showToast("Skrip dimuatkan daripada sejarah!");
            }
        }

        function toggleHistory() {
            const list = document.getElementById('historyList');
            const text = document.getElementById('historyToggleText');
            if (list.classList.contains('hidden')) {
                list.classList.remove('hidden');
                text.innerText = 'Sembunyikan Sejarah Skrip';
            } else {
                list.classList.add('hidden');
                text.innerText = 'Tunjukkan Sejarah Skrip';
            }
        }

        function showModal(title, message, iconType = 'amber', showWhatsApp = false) {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalBox = document.getElementById('modalBox');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalActionBtn = document.getElementById('modalActionBtn');

            modalTitle.innerText = title;
            modalMessage.innerText = message;

            if (showWhatsApp) {
                modalActionBtn.classList.remove('hidden');
            } else {
                modalActionBtn.classList.add('hidden');
            }

            modalOverlay.classList.remove('hidden');
            setTimeout(() => {
                modalBox.classList.remove('scale-95', 'opacity-0');
                modalBox.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalBox = document.getElementById('modalBox');

            modalBox.classList.remove('scale-100', 'opacity-100');
            modalBox.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
            }, 200);
        }

        function openTopupModal() {
            showModal(
                'Top-up Kredit Skrip', 
                'Dapatkan pakej kredit tambahan untuk menjana lebih banyak skrip tanpa had. Hubungi kami menerusi WhatsApp.', 
                'emerald', 
                true
            );
        }

        function modalAction() {
            window.open('https://wa.me/60123456789?text=Hai,%20saya%20nak%20topup%20kredit%20AI%20Skrip%20Generator', '_blank');
            closeModal();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</body>
</html>
